# invoice-master 最小配置示例
#
# 唯一真相源：scripts/invoice_master/config.py 里的 DEFAULT_CONFIG。
# 本文件只列「用户通常需要改的字段」，不复制默认值。原因：
#   1. 配置文件里的列表是「整体替换」而非追加，写半份列表会静默丢掉其余项；
#   2. 复制一份全量默认值必然随代码升级而漂移（历史上已发生过）。
# 因此这里出现的每个字段值都必须等于默认值 —— 由 tests/test_cli.py
# 的 TestExampleConfig 在 CI 中强制校验。
#
# 需要「全量配置模板」时用：invoice-master config --init invoice_master.yaml
# 注意：--init 会把当前环境变量里的授权码明文写进文件，执行前先 unset：
#   INVOICE_MASTER_MAILBOX_PASSWORD / INVOICE_MASTER_LLM_API_KEY
#
# 优先级：内置默认值 < 本文件 < 环境变量 INVOICE_MASTER_*

mailbox:
  # IMAP 服务器；常见值：imap.qq.com / imap.163.com
  host: ""
  username: ""
  # 授权码（不是登录密码）。务必留空，用环境变量注入：
  #   INVOICE_MASTER_MAILBOX_PASSWORD
  password: ""
  # 回溯天数。部分邮箱默认只让 IMAP 看近 30 天，
  # 需要追溯更久请在邮箱设置里开启「收取全部邮件」。
  days_back: 180
  # 只读访问，绝不标记已读 / 移动 / 删除邮件。
  read_only: true

filter:
  # 发件域名 / 发件人精确白名单，命中即通过筛选。留空 = 不启用。
  # 例：domain_whitelist: ["jtw.beijing.gov.cn"]
  domain_whitelist: []
  sender_whitelist: []
  # 主题 / 正文 / 排除关键词不在此列出，见 DEFAULT_CONFIG。
  # 如确需自定义，必须写「全量列表」——只写新增项会整体替换掉默认值。

archive:
  # 归档根目录
  root: ~/Desktop/发票整理
  # 目标公司名（填简称即可）；不匹配的发票隔离到「非目标公司发票」
  company_filter: ""

# 其余可调字段（不在此重复，见 DEFAULT_CONFIG）：
#   mailbox       port / use_ssl / max_body_bytes / timeout
#   filter        subject_keywords / body_keywords / exclude_subject_keywords /
#                 accepted_extensions / max_archive_depth / max_attachment_mb /
#                 min_image_size_px
#   extraction    local_enabled / max_pdf_pages / confidence_threshold /
#                 fallback_to_mtime
#   llm           enabled / base_url / model / api_key / timeout / max_retries /
#                 breaker_threshold / max_calls_per_run / max_image_px
#   archive       group_by_type / manual_review_folder / non_target_folder /
#                 rename_enabled / rename_template / company_match_mode
#   merge         orientation / rows / cols / rotate / page / margin_* / mode /
#                 batch_size / gap / draw_dividers / show_crop_marks / crop_mark_*
#   report        filename / amount_precision / highlight_duplicates /
#                 duplicate_fill
