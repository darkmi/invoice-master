name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          # 最低支持版本单独跑，确认没有误用新语法
          - os: ubuntu-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest tests/ -v --tb=short

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff 检查
        run: ruff check .

      - name: Ruff 格式校验
        run: ruff format --check .

  build:
    name: 构建校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建分发包
        run: |
          python -m pip install --upgrade pip build
          python -m build
          echo "构建产物："
          ls -lh dist/

      - name: 冒烟测试（安装后 CLI 可用）
        run: |
          pip install dist/*.whl
          invoice-master --version
          invoice-master layouts